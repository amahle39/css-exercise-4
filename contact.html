    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

</head>


<body class="bg-light">


<!-- Navigation -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">Amish Hair Salon</a>


        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

                <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>

                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>

                <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>

            </ul>

        </div>

    </div>

</nav>


<!-- Contact Form -->

<div class="container py-5">


    <div class="text-center mb-4">

        <h1 class="fw-bold">Contact Us</h1>

        <p class="lead">We would love to hear from you.</p>

    </div>


    <div class="row justify-content-center">

        <div class="col-md-8">


            <div class="alert alert-warning">

                Please complete the form below. This is a demonstration form.

            </div>


            <div class="card shadow animate__animated animate__fadeInUp">

                <div class="card-body p-4">


                    <form>


                        <div class="mb-3">

                            <label class="form-label" for="name">Full Name</label>

                            <input type="text" id="name" class="form-control"

                                   placeholder="Enter your full name">

                        </div>


                        <div class="mb-3">

                            <label class="form-label" for="email">Email Address</label>

                            <input type="email" id="email" class="form-control"

                                   placeholder="Enter your email">

                        </div>


                        <div class="mb-3">

                            <label class="form-label" for="subject">Subject</label>

                            <input type="text" id="subject" class="form-control"

                                   placeholder="Enter subject">

                        </div>


                        <div class="mb-3">

                            <label class="form-label" for="message">Your Message</label>

                            <textarea id="message" class="form-control" rows="5"

                                      placeholder="Write your message"></textarea>

                        </div>


                        <button type="button" class="btn btn-dark btn-lg" disabled>

                            Send Message

                        </button>


                    </form>


                </div>

            </div>


        </div>

    </div>


</div>


<!-- Footer -->

<footer class="bg-dark text-white text-center p-4">

    <p>© 2026 Amish Hair Salon. All Rights Reserved.</p>

    <p>Designed by [Amahle Tshongweni]</p>

</footer>

</body>

</html>
